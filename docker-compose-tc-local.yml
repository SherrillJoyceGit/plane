# 本机 development 的启动、launchd 前端托管和安全重载流程见 docs/local-development.md。
# 外置数据保留在 ${TC_PLANE_DATA_ROOT:-/Volumes/MacExt/docker-data/tc-plane-test}，不要使用 down -v。
name: tc-plane-test

x-api-offline-environment: &api-offline-environment
  PLANE_OFFLINE_MODE: "1"
  IS_TEST: "1"
  CORS_ALLOWED_ORIGINS: "http://${TC_PLANE_LAN_IP:-10.1.109.63}:3000,http://${TC_PLANE_LAN_IP:-10.1.109.63}:3001"
  WEB_URL: "http://${TC_PLANE_LAN_IP:-10.1.109.63}:8000"
  APP_BASE_URL: "http://${TC_PLANE_LAN_IP:-10.1.109.63}:3000"
  ADMIN_BASE_URL: "http://${TC_PLANE_LAN_IP:-10.1.109.63}:3001"
  AWS_S3_ENDPOINT_URL: "http://${TC_PLANE_LAN_IP:-10.1.109.63}:9000"
  USE_MINIO: "0"
  INSTANCE_CHANGELOG_URL: ""
  SENTRY_DSN: ""
  POSTHOG_API_KEY: ""
  POSTHOG_HOST: ""
  UNSPLASH_ACCESS_KEY: ""
  LLM_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITLAB_CLIENT_ID: ""
  GITLAB_CLIENT_SECRET: ""
  GITEA_CLIENT_ID: ""
  GITEA_CLIENT_SECRET: ""
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""

services:
  plane-redis:
    ports: !override
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes: !override
      - "${TC_PLANE_DATA_ROOT:-/Volumes/MacExt/docker-data/tc-plane-test}/redis:/data"

  plane-mq:
    volumes: !override
      - "${TC_PLANE_DATA_ROOT:-/Volumes/MacExt/docker-data/tc-plane-test}/rabbitmq:/var/lib/rabbitmq"

  plane-minio:
    ports: !override
      - "${TC_PLANE_LAN_IP:-10.1.109.63}:9000:9000"
      - "127.0.0.1:9090:9090"
    volumes: !override
      - "${TC_PLANE_DATA_ROOT:-/Volumes/MacExt/docker-data/tc-plane-test}/minio:/export"

  plane-db:
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes: !override
      - "${TC_PLANE_DATA_ROOT:-/Volumes/MacExt/docker-data/tc-plane-test}/postgres:/var/lib/postgresql/data"

  api:
    environment: *api-offline-environment
    depends_on:
      - plane-minio
    ports: !override
      - "${TC_PLANE_LAN_IP:-10.1.109.63}:8000:8000"

  worker:
    environment: *api-offline-environment
    command: "./bin/docker-entrypoint-worker.sh --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"

  beat-worker:
    environment: *api-offline-environment

  migrator:
    environment: *api-offline-environment
